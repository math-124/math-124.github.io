name: Publish Lab 11 at 5 PM Eastern

on:
  schedule:
    # Start early and wait for 22:00 UTC = 5 PM EST on November 11.
    - cron: '45 21 11 11 *'
    # Retry if a scheduled run is delayed or fails.
    - cron: '15,45 22 11 11 *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-lab11-2026-11-11
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check the one-time release window
        id: window
        run: |
          python3 - <<'PYCODE'
          import os
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          begin = datetime(2026, 11, 11, 21, tzinfo=timezone.utc)
          end = datetime(2026, 11, 12, 5, tzinfo=timezone.utc)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"proceed={str(begin <= now < end).lower()}\n")
          PYCODE

      - name: Wait until November 11 at 5 PM Eastern
        if: steps.window.outputs.proceed == 'true'
        run: |
          python3 -u - <<'PYCODE'
          import time
          from datetime import datetime, timezone
          target = datetime(2026, 11, 11, 22, tzinfo=timezone.utc).timestamp()
          while time.time() < target:
              time.sleep(min(30, max(0, target - time.time())))
          PYCODE

      - uses: actions/checkout@v5
        if: steps.window.outputs.proceed == 'true'
        with:
          ref: main

      - name: Add the Lab 11 homepage link
        if: steps.window.outputs.proceed == 'true'
        run: python3 .github/scripts/release_lab11.py

      # GITHUB_TOKEN pushes do not trigger push workflows, so dispatch explicitly.
      - name: Deploy the updated homepage
        if: steps.window.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-site.yml --ref main

      - name: Verify the live homepage link
        if: steps.window.outputs.proceed == 'true'
        run: |
          python3 -u - <<'PYCODE'
          import re
          import time
          from urllib.request import Request, urlopen
          deadline = time.monotonic() + 1200
          while time.monotonic() < deadline:
              try:
                  request = Request('https://math124.org/?lab11-release=20261111', headers={'Cache-Control': 'no-cache'})
                  with urlopen(request, timeout=30) as response:
                      html = response.read().decode()
                  if re.search(r'<a\b[^>]*href=[\"\'][^\"\']*/resources/labs/lab11/[\"\'][^>]*>\s*Gram-Schmidt and QR Factorization\s*</a>', html):
                      print('Lab 11 homepage link is live.')
                      break
              except Exception as error:
                  print(f'Waiting for deployment: {error}', flush=True)
              time.sleep(30)
          else:
              raise SystemExit('The Lab 11 homepage link did not become live within 20 minutes.')
          PYCODE

      - name: Disable the completed one-time schedule
        if: steps.window.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo 'Lab 11 homepage link is live: https://math124.org/resources/labs/lab11/' >> "$GITHUB_STEP_SUMMARY"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/release-lab11.yml/disable"
